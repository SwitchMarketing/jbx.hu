deployment:
  tasks:
    - export ROOTPATH=/home/jbxhu/
    - export PUBLICPATH=$ROOTPATH/public_html/
    - # Copy core folders outside of web root
    - /bin/cp -R app $ROOTPATH
    - # Copy the content of the public folder into public_html, except the admin source tree
    - for f in public/*; do [ "$(basename "$f")" = "admin" ] || /bin/cp -R "$f" $PUBLICPATH; done
    - # Ensure the admin directory exists, then copy only the production Sencha build into it
    - /bin/mkdir -p $PUBLICPATH/admin
    - /bin/cp -R public/admin/build/production/JBXAdmin/* $PUBLICPATH/admin/
