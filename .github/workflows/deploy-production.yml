name: Deploy production

on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  DEPLOY_HOST: 185.51.188.76
  DEPLOY_USER: jbxhu

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up deploy SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Deploy app/
        run: |
          tar -C app -czf - . | ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "tar -xzf - -C app"

      - name: Deploy public/
        run: |
          tar -C public --exclude=.htaccess --exclude=scss --exclude=theme --exclude=admin -czf - . | ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "tar -xzf - -C public_html"

      - name: Deploy admin build
        run: |
          tar -C public/admin/build/production/JBXAdmin -czf - . | ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "tar -xzf - -C public_html/admin"

      - name: Smoke check
        run: |
          curl -fsS --retry 3 --retry-delay 2 -o /dev/null -w '%{http_code}\n' https://jbx.hu/
          curl -fsS -o /dev/null https://jbx.hu/admin/

      - name: Clean up deploy key
        if: always()
        run: rm -f ~/.ssh/deploy_key
