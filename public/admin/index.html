<!DOCTYPE HTML>
<html manifest="">
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=10, user-scalable=yes">
    <meta name="mobile-web-app-capable" content="yes">

    <title>JBXAdmin</title>

    <!-- Quill HTML editor -->
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>

    <!-- The line below must be kept intact for Sencha Cmd to build your application -->
    <script id="microloader" data-app="671471b1-c45b-44d9-8555-ea0161df3883" type="text/javascript" src="bootstrap.js"></script>

    <style type="text/css">
        html, body {
            height: 100%;
            padding: 0;
            margin: 0;
        }
    
        body {
            background-color: rgba(0, 0, 0, .6);
        }
    
        #splash {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: rgba(0,0,0,.7);
            z-index: 999999;
        }
    
        #splash .spinner {
            width: 90px;
            height: 90px;
            text-align: center;
            position: absolute;
            top: 50%;
            left: 50%;
            margin-top: -45px;
            margin-left: -45px;
            overflow: hidden;
        }
    
        #splash .spinner span {
            position: absolute;
            width: 100%;
            height: 100%;
            color: #fed;
            text-align: center;
            font-family: sans-serif;
            font-size: 10px;
            left: 0;
            top: 0;
            line-height: 84px;
        }
    
        #splash .spinner:after {
            content: " ";
            display: block;
            width: 64px;
            height: 64px;
            margin: 8px;
            border-radius: 50%;
            border: 2px solid #fed;
            border-color: #fed transparent #fed transparent;
            animation: lds-dual-ring 1.2s linear infinite;
        }
        @keyframes lds-dual-ring {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* ---- Quill editor: dark theme ---- */
        .jbx-quill-wrap .ql-toolbar.ql-snow {
            background: #21465b;
            border: 1px solid #2d5876;
            border-bottom: 0;
        }
        .jbx-quill-wrap .ql-toolbar.ql-snow .ql-stroke { stroke: #cfd8dc; }
        .jbx-quill-wrap .ql-toolbar.ql-snow .ql-fill   { fill: #cfd8dc; }
        .jbx-quill-wrap .ql-toolbar.ql-snow .ql-picker-label { color: #cfd8dc; }
        .jbx-quill-wrap .ql-toolbar.ql-snow .ql-picker-label::before,
        .jbx-quill-wrap .ql-toolbar.ql-snow .ql-picker-item::before { color: #cfd8dc; }
        .jbx-quill-wrap .ql-toolbar.ql-snow button:hover .ql-stroke,
        .jbx-quill-wrap .ql-toolbar.ql-snow button.ql-active .ql-stroke,
        .jbx-quill-wrap .ql-toolbar.ql-snow .ql-picker-label:hover,
        .jbx-quill-wrap .ql-toolbar.ql-snow .ql-picker-label.ql-active { stroke: #8ecaff; color: #8ecaff; }
        .jbx-quill-wrap .ql-toolbar.ql-snow button:hover .ql-fill,
        .jbx-quill-wrap .ql-toolbar.ql-snow button.ql-active .ql-fill { fill: #8ecaff; }
        .jbx-quill-wrap .ql-container.ql-snow {
            background: #1a2833;
            border: 1px solid #2d5876;
        }
        .jbx-quill-wrap .ql-editor {
            background: #1a2833;
            color: #e8e8e8;
            min-height: 200px;
        }
        .jbx-quill-wrap .ql-editor a { color: #8ecaff; }
        .jbx-quill-wrap .ql-editor blockquote {
            border-left-color: #2d5876;
            color: #b0bec5;
        }
        .jbx-quill-wrap .ql-editor code,
        .jbx-quill-wrap .ql-editor pre {
            background: #0f1a22;
            color: #e0f2ff;
        }
        .jbx-quill-wrap .ql-editor.ql-blank::before { color: #7a8a95; font-style: italic; }
        .jbx-quill-wrap .ql-snow .ql-picker-options {
            background: #1a2833;
            color: #e8e8e8;
            border: 1px solid #2d5876;
        }
        .jbx-quill-wrap .ql-snow .ql-tooltip {
            background: #21465b;
            color: #e8e8e8;
            border: 1px solid #2d5876;
            box-shadow: 0 2px 8px rgba(0,0,0,.4);
        }
        .jbx-quill-wrap .ql-snow .ql-tooltip input[type=text] {
            background: #1a2833;
            color: #e8e8e8;
            border: 1px solid #2d5876;
        }
        .jbx-quill-wrap .ql-snow .ql-tooltip a { color: #8ecaff; }

        /* Edit-in-progress row highlight */
        .x-gridrow.jbx-editing-row,
        .x-gridrow.jbx-editing-row .x-gridcell,
        .x-listitem.jbx-editing-row {
            background-color: #21465b !important;
            color: #fff !important;
        }

        /* ---- Product preview card + variants table (theme-aware) ---- */
        .jbx-paper {
            background: #fff;
            color: #222;
            padding: 16px 20px;
            border-radius: 4px;
        }
        .jbx-paper h3 { color: inherit; margin: 20px 0 8px; }
        .jbx-paper table.lead {
            width: 100%;
            border-collapse: collapse;
        }
        .jbx-paper table.lead td {
            padding: 6px 8px;
            border-bottom: 1px solid #eee;
            vertical-align: top;
        }
        .jbx-paper .variants-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 6px;
        }
        .jbx-paper .variants-table th,
        .jbx-paper .variants-table td {
            border: 1px solid #ddd;
            padding: 8px 10px;
            text-align: left;
        }
        .jbx-paper .variants-table thead th {
            background: #f5f5f5;
            font-weight: 600;
        }

        @media (prefers-color-scheme: dark) {
            .jbx-paper {
                background: #2b2b2b;
                color: #e0e0e0;
            }
            .jbx-paper table.lead td {
                color: #e0e0e0;
                border-bottom-color: #3a3a3a;
            }
            .jbx-paper .variants-table {
                background: #2b2b2b;
                color: #e0e0e0;
            }
            .jbx-paper .variants-table th,
            .jbx-paper .variants-table td {
                background: #2b2b2b;
                color: #e0e0e0;
                border-color: #3a3a3a;
            }
            .jbx-paper .variants-table thead th {
                background: #1f1f1f;
                color: #fff;
            }
            .jbx-paper .variants-table tbody tr:nth-child(even) td {
                background: #323232;
            }

            /* ExtJS grid opted-in via userCls */
            .jbx-themed-grid,
            .jbx-themed-grid .x-gridrow,
            .jbx-themed-grid .x-gridcell {
                background-color: #2b2b2b !important;
                color: #e0e0e0 !important;
            }
            .jbx-themed-grid .x-gridcell {
                border-color: #3a3a3a !important;
            }
            .jbx-themed-grid .x-gridrow.x-selected,
            .jbx-themed-grid .x-gridrow.x-selected .x-gridcell {
                background-color: #3a3a3a !important;
            }
            .jbx-themed-grid .x-headercontainer,
            .jbx-themed-grid .x-column-header,
            .jbx-themed-grid .x-column-header .x-text-el {
                background-color: #1f1f1f !important;
                color: #e0e0e0 !important;
                border-color: #3a3a3a !important;
            }
            .jbx-themed-grid input,
            .jbx-themed-grid .x-input-el {
                background-color: #1f1f1f !important;
                color: #e0e0e0 !important;
            }
        }
    </style>
</head>
<body>
    <body class="launching">
        <div id="splash">
          <div class="spinner"><span>Betöltés...</span></div>
        </div>    
      </body>
</body>
</html>
