<!DOCTYPE HTML>
<html manifest="">
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=10, user-scalable=yes">
    <meta name="mobile-web-app-capable" content="yes">

    <title>JBXAdmin</title>

    <!-- Quill HTML editor -->
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
    <!-- Markdown (súgó) — helyi másolat, marked@12.0.2 -->
    <script src="resources/lib/marked.min.js"></script>

    <!-- The line below must be kept intact for Sencha Cmd to build your application -->
    <script id="microloader" data-app="671471b1-c45b-44d9-8555-ea0161df3883" type="text/javascript" src="bootstrap.js"></script>

    <style type="text/css">
        html, body {
            height: 100%;
            padding: 0;
            margin: 0;
        }
    
        body {
            background-color: #121518;
        }
    
        #splash {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #121518;
            z-index: 999999;
        }
    
        #splash .spinner {
            width: 90px;
            height: 90px;
            text-align: center;
            position: absolute;
            top: 50%;
            left: 50%;
            margin-top: -45px;
            margin-left: -45px;
            overflow: hidden;
        }
    
        #splash .spinner span {
            position: absolute;
            width: 100%;
            height: 100%;
            color: #e6e9ec;
            text-align: center;
            font-family: sans-serif;
            font-size: 10px;
            left: 0;
            top: 0;
            line-height: 84px;
        }
    
        #splash .spinner:after {
            content: " ";
            display: block;
            width: 64px;
            height: 64px;
            margin: 8px;
            border-radius: 50%;
            border: 2px solid #f2d22f;
            border-color: #f2d22f transparent #f2d22f transparent;
            animation: lds-dual-ring 1.2s linear infinite;
        }
        @keyframes lds-dual-ring {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* ---- Quill editor: sötét téma (a Material CSS-változóira kötve) ---- */
        .jbx-quill-wrap .ql-toolbar.ql-snow {
            background: var(--alt-background-color, #20252a);
            border: 1px solid var(--divider-color, #2e353c);
            border-bottom: 0;
            border-radius: 4px 4px 0 0;
        }
        .jbx-quill-wrap .ql-toolbar.ql-snow .ql-stroke { stroke: #b9c1c8; }
        .jbx-quill-wrap .ql-toolbar.ql-snow .ql-fill   { fill: #b9c1c8; }
        .jbx-quill-wrap .ql-toolbar.ql-snow .ql-picker-label { color: #b9c1c8; }
        .jbx-quill-wrap .ql-toolbar.ql-snow .ql-picker-label::before,
        .jbx-quill-wrap .ql-toolbar.ql-snow .ql-picker-item::before { color: #b9c1c8; }
        .jbx-quill-wrap .ql-toolbar.ql-snow button:hover .ql-stroke,
        .jbx-quill-wrap .ql-toolbar.ql-snow button.ql-active .ql-stroke,
        .jbx-quill-wrap .ql-toolbar.ql-snow .ql-picker-label:hover,
        .jbx-quill-wrap .ql-toolbar.ql-snow .ql-picker-label.ql-active { stroke: var(--base-color, #f2d22f); color: var(--base-color, #f2d22f); }
        .jbx-quill-wrap .ql-toolbar.ql-snow button:hover .ql-fill,
        .jbx-quill-wrap .ql-toolbar.ql-snow button.ql-active .ql-fill { fill: var(--base-color, #f2d22f); }
        .jbx-quill-wrap .ql-container.ql-snow {
            background: var(--background-color, #1a1e22);
            border: 1px solid var(--divider-color, #2e353c);
            border-radius: 0 0 4px 4px;
        }
        .jbx-quill-wrap .ql-editor {
            background: var(--background-color, #1a1e22);
            color: var(--color, #e6e9ec);
            min-height: 200px;
        }
        .jbx-quill-wrap .ql-editor a { color: var(--base-color, #f2d22f); }
        .jbx-quill-wrap .ql-editor blockquote {
            border-left-color: var(--faded-color, #3a424a);
            color: var(--highlight-color, rgba(230,233,236,.62));
        }
        .jbx-quill-wrap .ql-editor code,
        .jbx-quill-wrap .ql-editor pre {
            background: #121518;
            color: var(--color, #e6e9ec);
        }
        .jbx-quill-wrap .ql-editor.ql-blank::before { color: var(--disabled-color, rgba(230,233,236,.36)); font-style: italic; }
        .jbx-quill-wrap .ql-snow .ql-picker-options {
            background: var(--alt-background-color, #20252a);
            color: var(--color, #e6e9ec);
            border: 1px solid var(--divider-color, #2e353c);
        }
        .jbx-quill-wrap .ql-snow .ql-tooltip {
            background: var(--alt-background-color, #20252a);
            color: var(--color, #e6e9ec);
            border: 1px solid var(--divider-color, #2e353c);
            box-shadow: 0 2px 8px rgba(0,0,0,.4);
        }
        .jbx-quill-wrap .ql-snow .ql-tooltip input[type=text] {
            background: var(--background-color, #1a1e22);
            color: var(--color, #e6e9ec);
            border: 1px solid var(--divider-color, #2e353c);
        }
        .jbx-quill-wrap .ql-snow .ql-tooltip a { color: var(--base-color, #f2d22f); }

        /* Szerkesztés alatt álló sor kiemelése */
        .x-gridrow.jbx-editing-row,
        .x-gridrow.jbx-editing-row .x-gridcell,
        .x-listitem.jbx-editing-row {
            background-color: var(--selected-background-color, #38372a) !important;
            color: #fff !important;
        }
        .x-gridrow.jbx-editing-row {
            box-shadow: inset 3px 0 0 var(--base-color, #f2d22f);
        }

        /* ---- Termék előnézet kártya + variáns táblázat (az admin mindig sötét) ---- */
        .jbx-paper {
            background: var(--alt-background-color, #20252a);
            color: var(--color, #e6e9ec);
            padding: 16px 20px;
            border-radius: 4px;
        }
        .jbx-paper h3 { color: inherit; margin: 20px 0 8px; }
        .jbx-paper table.lead {
            width: 100%;
            border-collapse: collapse;
        }
        .jbx-paper table.lead td {
            padding: 6px 8px;
            color: var(--color, #e6e9ec);
            border-bottom: 1px solid var(--divider-color, #2e353c);
            vertical-align: top;
        }
        .jbx-paper .variants-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 6px;
        }
        .jbx-paper .variants-table th,
        .jbx-paper .variants-table td {
            background: var(--background-color, #1a1e22);
            color: var(--color, #e6e9ec);
            border: 1px solid var(--divider-color, #2e353c);
            padding: 8px 10px;
            text-align: left;
        }
        .jbx-paper .variants-table thead th {
            background: var(--header-background-color, #20252a);
            color: #fff;
            font-weight: 600;
        }
        .jbx-paper .variants-table tbody tr:nth-child(even) td {
            background: var(--alt-background-color, #20252a);
        }

        /* userCls-sel bekapcsolt ExtJS grid */
        .jbx-themed-grid,
        .jbx-themed-grid .x-gridrow,
        .jbx-themed-grid .x-gridcell {
            background-color: var(--background-color, #1a1e22) !important;
            color: var(--color, #e6e9ec) !important;
        }
        .jbx-themed-grid .x-gridcell {
            border-color: var(--divider-color, #2e353c) !important;
        }
        .jbx-themed-grid .x-gridrow.x-selected,
        .jbx-themed-grid .x-gridrow.x-selected .x-gridcell {
            background-color: var(--selected-background-color, #38372a) !important;
        }
        .jbx-themed-grid .x-headercontainer,
        .jbx-themed-grid .x-column-header,
        .jbx-themed-grid .x-column-header .x-text-el {
            background-color: var(--header-background-color, #20252a) !important;
            color: var(--color, #e6e9ec) !important;
            border-color: var(--divider-color, #2e353c) !important;
        }
        .jbx-themed-grid input,
        .jbx-themed-grid .x-input-el {
            background-color: #121518 !important;
            color: var(--color, #e6e9ec) !important;
        }
    </style>
</head>
<body>
    <body class="launching">
        <div id="splash">
          <div class="spinner"><span>Betöltés...</span></div>
        </div>    
      </body>
</body>
</html>
